        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.2rem;
            color: #666;
            margin-top: 0;
            margin-bottom: 20px;
        }
        #topic-text {
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a1a1a;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            word-break: break-all;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 10px rgba(0, 122, 255, 0.3);
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.97);
            background-color: #005bb5;
        }
    </style>
</head>

        function drawTopic() {
            // すべてのお題を使い切ったら、リストを元通りに復活させる

                availableTopics = [...originalTopics];
            }
            
            // 残っているお題の中からランダムに1つ選ぶインデックスを取得

            // 選ばれたお題を取り出し、リストから削除する（＝もう一度出なくなる）
